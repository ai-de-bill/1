    <rect x="0" y="0" width="1440" height="1290" fill="#ffffff"/>
    <text x="24" y="38" class="title">mul_ascend: что происходит с данными на реальном примере</text>
    <text x="24" y="62" class="subtitle">дамп промежуточных буферов из настоящего ядра на CPU-модели Ascend910B; 3 элемента (хвост тайла), показаны только валидные лейны</text>
    <line x1="30" y1="78" x2="1410" y2="78" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="30" y="104" class="stage">1) GM: входные int64 (x и y)</text>
    <text x="30" y="134" class="text">x[i]</text>
  <rect x="380" y="114" width="200" height="30" rx="6" fill="#bfdbfe" stroke="#1f2937" stroke-width="1.4"/><text x="480" y="134" text-anchor="middle" class="mono" font-size="14px">0000000200000001</text>
  <rect x="590" y="114" width="200" height="30" rx="6" fill="#bfdbfe" stroke="#1f2937" stroke-width="1.4"/><text x="690" y="134" text-anchor="middle" class="mono" font-size="14px">ffffffffffffffff</text>
  <rect x="800" y="114" width="200" height="30" rx="6" fill="#bfdbfe" stroke="#1f2937" stroke-width="1.4"/><text x="900" y="134" text-anchor="middle" class="mono" font-size="14px">123456789abcdef0</text>
    <text x="30" y="172" class="text">y[i]</text>
  <rect x="380" y="152" width="200" height="30" rx="6" fill="#bfdbfe" stroke="#1f2937" stroke-width="1.4"/><text x="480" y="172" text-anchor="middle" class="mono" font-size="14px">0000000300000004</text>
  <rect x="590" y="152" width="200" height="30" rx="6" fill="#bfdbfe" stroke="#1f2937" stroke-width="1.4"/><text x="690" y="172" text-anchor="middle" class="mono" font-size="14px">ffffffffffffffff</text>
  <rect x="800" y="152" width="200" height="30" rx="6" fill="#bfdbfe" stroke="#1f2937" stroke-width="1.4"/><text x="900" y="172" text-anchor="middle" class="mono" font-size="14px">fedcba9876543210</text>
    <text x="380" y="204" class="small">старшие 32 бита каждого int64 — это aHi/bHi, младшие — aLo/bLo</text>
    <line x1="700" y1="214" x2="700" y2="238" class="arrow"/>
    <line x1="30" y1="246" x2="1410" y2="246" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="30" y="272" class="stage">2) UB: сырой тайл как uint32-лейны (x и y лежат подряд в одном буфере)</text>
    <text x="30" y="302" class="text">x: lo0 hi0 lo1 hi1 ...</text>
  <rect x="380" y="282" width="110" height="30" rx="6" fill="#bfdbfe" stroke="#1f2937" stroke-width="1.4"/><text x="435" y="302" text-anchor="middle" class="mono" font-size="14px">00000001</text>
  <rect x="500" y="282" width="110" height="30" rx="6" fill="#bfdbfe" stroke="#1f2937" stroke-width="1.4"/><text x="555" y="302" text-anchor="middle" class="mono" font-size="14px">00000002</text>
  <rect x="620" y="282" width="110" height="30" rx="6" fill="#bfdbfe" stroke="#1f2937" stroke-width="1.4"/><text x="675" y="302" text-anchor="middle" class="mono" font-size="14px">ffffffff</text>
  <rect x="740" y="282" width="110" height="30" rx="6" fill="#bfdbfe" stroke="#1f2937" stroke-width="1.4"/><text x="795" y="302" text-anchor="middle" class="mono" font-size="14px">ffffffff</text>
  <rect x="860" y="282" width="110" height="30" rx="6" fill="#bfdbfe" stroke="#1f2937" stroke-width="1.4"/><text x="915" y="302" text-anchor="middle" class="mono" font-size="14px">9abcdef0</text>
  <rect x="980" y="282" width="110" height="30" rx="6" fill="#bfdbfe" stroke="#1f2937" stroke-width="1.4"/><text x="1035" y="302" text-anchor="middle" class="mono" font-size="14px">12345678</text>
    <text x="380" y="326" class="small">y начинается по смещению 8*TILE_ELEMS = 4096 байт</text>
    <line x1="700" y1="336" x2="700" y2="360" class="arrow"/>
  <text x="716" y="354" class="small">Gather со смещениями В БАЙТАХ: 8j (младшие половины) и 8j+4 (старшие)</text>
    <line x1="30" y1="368" x2="1410" y2="368" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="30" y="394" class="stage">3) Split: 2 Gather вместо 4 — сразу [aLo | bLo] и [aHi | bHi]</text>
    <text x="30" y="424" class="text">aLo</text>
  <rect x="380" y="404" width="110" height="30" rx="6" fill="#bbf7d0" stroke="#1f2937" stroke-width="1.4"/><text x="435" y="424" text-anchor="middle" class="mono" font-size="14px">00000001</text>
  <rect x="500" y="404" width="110" height="30" rx="6" fill="#bbf7d0" stroke="#1f2937" stroke-width="1.4"/><text x="555" y="424" text-anchor="middle" class="mono" font-size="14px">ffffffff</text>
  <rect x="620" y="404" width="110" height="30" rx="6" fill="#bbf7d0" stroke="#1f2937" stroke-width="1.4"/><text x="675" y="424" text-anchor="middle" class="mono" font-size="14px">9abcdef0</text>
    <text x="30" y="462" class="text">aHi</text>
  <rect x="380" y="442" width="110" height="30" rx="6" fill="#bbf7d0" stroke="#1f2937" stroke-width="1.4"/><text x="435" y="462" text-anchor="middle" class="mono" font-size="14px">00000002</text>
