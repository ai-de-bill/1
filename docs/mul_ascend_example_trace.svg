  <rect x="910" y="442" width="110" height="30" rx="6" fill="#bbf7d0" stroke="#1f2937" stroke-width="1.4"/><text x="965" y="462" text-anchor="middle" class="mono" font-size="14px">ffffffff</text>
  <rect x="1030" y="442" width="110" height="30" rx="6" fill="#bbf7d0" stroke="#1f2937" stroke-width="1.4"/><text x="1085" y="462" text-anchor="middle" class="mono" font-size="14px">fedcba98</text>
    <line x1="700" y1="480" x2="700" y2="504" class="arrow"/>
