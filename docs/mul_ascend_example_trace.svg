  <text x="30" y="538" class="stage">4) Три произведения: младшие 32 бита — ровно одна инструкция Mul</text>
    <text x="30" y="568" class="text">rLo = Mul(aLo,bLo)</text>
  <rect x="380" y="548" width="130" height="30" rx="6" fill="#fde68a" stroke="#1f2937" stroke-width="1.4"/><text x="445" y="568" text-anchor="middle" class="mono" font-size="14px">00000004</text>
  <rect x="520" y="548" width="130" height="30" rx="6" fill="#fde68a" stroke="#1f2937" stroke-width="1.4"/><text x="585" y="568" text-anchor="middle" class="mono" font-size="14px">00000001</text>
  <rect x="660" y="548" width="130" height="30" rx="6" fill="#fde68a" stroke="#1f2937" stroke-width="1.4"/><text x="725" y="568" text-anchor="middle" class="mono" font-size="14px">5618cf00</text>
    <text x="30" y="606" class="text">p1 = Mul(aLo,bHi)</text>
  <rect x="380" y="586" width="130" height="30" rx="6" fill="#fde68a" stroke="#1f2937" stroke-width="1.4"/><text x="445" y="606" text-anchor="middle" class="mono" font-size="14px">00000003</text>
  <rect x="520" y="586" width="130" height="30" rx="6" fill="#fde68a" stroke="#1f2937" stroke-width="1.4"/><text x="585" y="606" text-anchor="middle" class="mono" font-size="14px">00000001</text>
  <rect x="660" y="586" width="130" height="30" rx="6" fill="#fde68a" stroke="#1f2937" stroke-width="1.4"/><text x="725" y="606" text-anchor="middle" class="mono" font-size="14px">d05ebe80</text>
    <text x="30" y="644" class="text">p2 = Mul(aHi,bLo)</text>
  <rect x="380" y="624" width="130" height="30" rx="6" fill="#fde68a" stroke="#1f2937" stroke-width="1.4"/><text x="445" y="644" text-anchor="middle" class="mono" font-size="14px">00000008</text>
  <rect x="520" y="624" width="130" height="30" rx="6" fill="#fde68a" stroke="#1f2937" stroke-width="1.4"/><text x="585" y="644" text-anchor="middle" class="mono" font-size="14px">00000001</text>
  <rect x="660" y="624" width="130" height="30" rx="6" fill="#fde68a" stroke="#1f2937" stroke-width="1.4"/><text x="725" y="644" text-anchor="middle" class="mono" font-size="14px">0b88d780</text>
    <text x="790" y="568" class="small">rLo — это сразу младшие 32 бита результата</text>
    <text x="790" y="606" class="small">p1/p2 нужны только младшими 32 битами</text>
    <line x1="700" y1="664" x2="700" y2="688" class="arrow"/>
  <text x="716" y="682" class="small">high32(aLo*bLo) = MulHi (22 инструкции), затем rHi = MulHi + p1 + p2</text>
    <line x1="30" y1="696" x2="1410" y2="696" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="30" y="722" class="stage">5) MulHi внутри — элемент [1] (все 0xFFFFFFFF: максимум переносов)</text>
    <text x="30" y="752" class="text">x0  x1  y0  y1  (16 бит)</text>
  <rect x="380" y="732" width="130" height="30" rx="6" fill="#ddd6fe" stroke="#1f2937" stroke-width="1.4"/><text x="445" y="752" text-anchor="middle" class="mono" font-size="14px">0000ffff</text>
  <rect x="520" y="732" width="130" height="30" rx="6" fill="#ddd6fe" stroke="#1f2937" stroke-width="1.4"/><text x="585" y="752" text-anchor="middle" class="mono" font-size="14px">0000ffff</text>
  <rect x="660" y="732" width="130" height="30" rx="6" fill="#ddd6fe" stroke="#1f2937" stroke-width="1.4"/><text x="725" y="752" text-anchor="middle" class="mono" font-size="14px">0000ffff</text>
  <rect x="800" y="732" width="130" height="30" rx="6" fill="#ddd6fe" stroke="#1f2937" stroke-width="1.4"/><text x="865" y="752" text-anchor="middle" class="mono" font-size="14px">0000ffff</text>
    <text x="940" y="752" class="small">x0/y0 — младшие 16 бит, x1/y1 — старшие</text>
    <text x="30" y="790" class="text">U=x0*y1  V=x1*y0  W=x1*y1  A=x0*y0</text>
  <rect x="380" y="770" width="130" height="30" rx="6" fill="#ddd6fe" stroke="#1f2937" stroke-width="1.4"/><text x="445" y="790" text-anchor="middle" class="mono" font-size="14px">fffe0001</text>
  <rect x="520" y="770" width="130" height="30" rx="6" fill="#ddd6fe" stroke="#1f2937" stroke-width="1.4"/><text x="585" y="790" text-anchor="middle" class="mono" font-size="14px">fffe0001</text>
  <rect x="660" y="770" width="130" height="30" rx="6" fill="#ddd6fe" stroke="#1f2937" stroke-width="1.4"/><text x="725" y="790" text-anchor="middle" class="mono" font-size="14px">fffe0001</text>
  <rect x="800" y="770" width="130" height="30" rx="6" fill="#ddd6fe" stroke="#1f2937" stroke-width="1.4"/><text x="865" y="790" text-anchor="middle" class="mono" font-size="14px">fffe0001</text>
    <text x="30" y="828" class="text">U0  V0  T_lo=s0&amp;0xffff  c0=s0&gt;&gt;16</text>
  <rect x="380" y="808" width="130" height="30" rx="6" fill="#ddd6fe" stroke="#1f2937" stroke-width="1.4"/><text x="445" y="828" text-anchor="middle" class="mono" font-size="14px">00000001</text>
  <rect x="520" y="808" width="130" height="30" rx="6" fill="#ddd6fe" stroke="#1f2937" stroke-width="1.4"/><text x="585" y="828" text-anchor="middle" class="mono" font-size="14px">00000001</text>
  <rect x="660" y="808" width="130" height="30" rx="6" fill="#ddd6fe" stroke="#1f2937" stroke-width="1.4"/><text x="725" y="828" text-anchor="middle" class="mono" font-size="14px">00000002</text>
  <rect x="800" y="808" width="130" height="30" rx="6" fill="#ddd6fe" stroke="#1f2937" stroke-width="1.4"/><text x="865" y="828" text-anchor="middle" class="mono" font-size="14px">00000000</text>
    <text x="940" y="828" class="small">c0=1: перенос из s0 = U0+V0 = 0x0001+0x0001 = 0x10000</text>
    <text x="30" y="866" class="text">T_hi  S_hi  high32</text>
  <rect x="380" y="846" width="130" height="30" rx="6" fill="#ddd6fe" stroke="#1f2937" stroke-width="1.4"/><text x="445" y="866" text-anchor="middle" class="mono" font-size="14px">0001fffc</text>
  <rect x="520" y="846" width="130" height="30" rx="6" fill="#ddd6fe" stroke="#1f2937" stroke-width="1.4"/><text x="585" y="866" text-anchor="middle" class="mono" font-size="14px">00000001</text>
  <rect x="660" y="846" width="130" height="30" rx="6" fill="#ddd6fe" stroke="#1f2937" stroke-width="1.4"/><text x="725" y="866" text-anchor="middle" class="mono" font-size="14px">fffffffe</text>
    <text x="800" y="866" class="small">T_hi = U1+V1+c0 = fffe+fffe+1 = 0x1fffc;  high32 = W+T_hi+S_hi = fffffffe</text>
